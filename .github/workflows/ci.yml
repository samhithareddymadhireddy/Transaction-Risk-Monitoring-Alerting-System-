name: CI Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    name: Backend (Java 17 & Spring Boot)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: riskmonitor
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Build, Tests & JaCoCo Coverage Check (>=80%)
        run: |
          cd backend
          mvn -B clean verify
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_NAME: riskmonitor
          DB_USER: postgres
          DB_PASSWORD: postgres
          AWS_ENDPOINT: http://localhost:4566
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test

  ml:
    name: ML Pipeline & Evaluation (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ml/requirements.txt'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r ml/requirements.txt

      - name: Run Pytest with Coverage Enforcement (>=80%)
        env:
          PYTHONPATH: .
        run: |
          pytest ml/tests/ --cov=ml --cov-fail-under=80 --cov-report=term-missing

  docker:
    name: Docker Container Build
    runs-on: ubuntu-latest
    needs: [backend, ml]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t riskmonitor-backend:latest backend/
