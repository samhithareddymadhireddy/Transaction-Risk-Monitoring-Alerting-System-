server:
  port: 0

spring:
  application:
    name: riskmonitor-test
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:riskmonitor}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

rules:
  velocity:
    window-minutes: 10
    threshold-medium: 5
    threshold-high: 10
  unusual-amount:
    multiplier-medium: 5.0
    multiplier-high: 10.0
    min-amount: 500.0
    trailing-days: 30
  geo-mismatch:
    hop-window-minutes: 60
  new-device:
    min-amount-low: 200.0
    min-amount-medium: 1000.0

aws:
  region: us-east-1
  s3:
    enabled: false
    bucket-name: test-bucket
  dynamodb:
    enabled: false
    table-name: test-ingestion-jobs
